<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Based Clef Demo — Sign In</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c1017;
      color: #e2e8f0;
      max-width: 380px;
      margin: 64px auto;
      padding: 28px;
      border: 1px solid #1e293b;
      border-radius: 10px;
      background-color: #111827;
    }
    h2 { margin: 0 0 6px; font-size: 20px; color: #f8fafc; }
    p.sub { margin: 0 0 18px; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-top: 12px; }
    input, button {
      display: block;
      width: 100%;
      margin: 6px 0 0;
      padding: 10px 12px;
      box-sizing: border-box;
      border-radius: 6px;
      font-size: 14px;
    }
    input {
      background: #0b0f19;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    button {
      margin-top: 18px;
      background: #0284c7;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    a { display: inline-block; margin-top: 12px; font-size: 13px; color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <h2 id="h">Operator Console</h2>
  <p class="sub">Sign in to verify System 1 form automation.</p>
  <form id="f" onsubmit="return go(event)">
    <label>Email<input id="e" type="email" required placeholder="Email"></label>
    <label>Password<input id="p" type="password" required placeholder="Password"></label>
    <button id="submit-btn" type="submit">Sign in</button>
    <a id="forgot-link" href="#" onclick="return false">Forgot password?</a>
  </form>
  <script>
    function go(ev) {
      ev.preventDefault();
      if (document.getElementById('e').value && document.getElementById('p').value) {
        document.body.innerHTML = '<h2>Welcome back!</h2><p>You are now logged in.</p><button id="logout-btn" onclick="location.reload()">Log out</button>';
      }
      return false;
    }
  </script>
</body>
</html>
