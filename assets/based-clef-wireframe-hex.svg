<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="hex-dark" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#0c0d11" />
    </radialGradient>
    <linearGradient id="p-p-o" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="soft-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#08090c" />

  <!-- Outer Isometric Hex Grid Line System -->
  <g stroke="#262b38" stroke-width="1.2" opacity="0.6">
    <!-- Concentric Hexagons -->
    <polygon points="256,40 443,148 443,364 256,472 69,364 69,148" fill="url(#hex-dark)" stroke="#3a4154" stroke-width="2" />
    <polygon points="256,70 417,163 417,349 256,442 95,349 95,163" fill="none" />
    <polygon points="256,100 391,178 391,334 256,412 121,334 121,178" fill="none" />

    <!-- Diagonal Radial Guides -->
    <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4 6" opacity="0.4" />
    <line x1="69" y1="148" x2="443" y2="364" stroke-dasharray="4 6" opacity="0.4" />
    <line x1="69" y1="364" x2="443" y2="148" stroke-dasharray="4 6" opacity="0.4" />
  </g>

  <!-- Clean Line Glyphs with Multi-stop Gradient -->
  <g filter="url(#soft-neon)">
    <!-- Circuit lines leading into the glyph -->
    <path d="M 121 256 L 180 256 L 205 200" fill="none" stroke="#9333ea" stroke-width="2.5" opacity="0.6" />
    <path d="M 391 256 L 360 256" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.6" />

    <!-- Geometric faceted Clef Outline (Dual parallel strokes) -->
    <path d="M 215 175 C 215 110, 325 110, 325 185 C 325 255, 255 305, 195 355" 
          fill="none" stroke="url(#p-p-o)" stroke-width="12" stroke-linecap="round" />
    <path d="M 220 175 C 220 125, 310 125, 310 185 C 310 245, 250 295, 200 345" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <!-- Head Node -->
    <circle cx="215" cy="175" r="16" fill="#9333ea" stroke="#ffffff" stroke-width="3" />
    <circle cx="215" cy="175" r="6" fill="#f97316" />

    <!-- Clean Hexagonal Probability Nodes -->
    <!-- Top Node -->
    <polygon points="365,150 377,157 377,171 365,178 353,171 353,157" fill="#1e222b" stroke="#ec4899" stroke-width="3" />
    <circle cx="365" cy="164" r="3" fill="#ffffff" />

    <!-- Bottom Node -->
    <polygon points="365,210 377,217 377,231 365,238 353,231 353,217" fill="#1e222b" stroke="#f97316" stroke-width="3" />
    <circle cx="365" cy="224" r="3" fill="#ffffff" />
  </g>

  <!-- Audio Waveform Line Accent in Carbon Footer -->
  <path d="M 170 410 L 210 410 L 220 395 L 230 425 L 240 400 L 250 420 L 260 410 L 342 410" 
        fill="none" stroke="url(#p-p-o)" stroke-width="2.5" stroke-linecap="round" />
</svg>