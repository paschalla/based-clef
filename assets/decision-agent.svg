<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff33cc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="magenta-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff33cc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cyan-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" ry="52" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Decision Flow Geometry -->
  <g filter="url(#glow)">
    <!-- Branching lines -->
    <path d="M 68 128 L 128 72 L 188 128 L 128 184 Z" fill="none" stroke="url(#magenta-cyan)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Central fast-forward arrow / cursor -->
    <path d="M 112 104 L 152 128 L 112 152 Z" fill="url(#magenta-cyan)" />
    
    <!-- Decision nodes -->
    <circle cx="128" cy="72" r="10" fill="#ff33cc" />
    <circle cx="188" cy="128" r="10" fill="#38bdf8" />
    <circle cx="128" cy="184" r="10" fill="#4ade80" />
    <circle cx="68" cy="128" r="10" fill="#ff33cc" />
    
    <!-- Inner pulses -->
    <circle cx="128" cy="72" r="4" fill="#ffffff" />
    <circle cx="188" cy="128" r="4" fill="#ffffff" />
    <circle cx="128" cy="184" r="4" fill="#ffffff" />
    <circle cx="68" cy="128" r="4" fill="#ffffff" />
  </g>
</svg>