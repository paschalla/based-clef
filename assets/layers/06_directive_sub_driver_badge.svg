<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">

  
  <defs>
    <!-- Deep Matte Carbon Canvas -->
    <linearGradient id="carbon-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#07080b" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <!-- Flat Triple Sunset Matte Gradient -->
    <linearGradient id="sunset-matte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="48%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;family=JetBrains+Mono:wght@700;800&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      .font-brand {
        font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-weight: 900;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Ubuntu Mono', 'SF Mono', monospace;
        font-weight: 800;
      }
    </style>
  </defs>

  <g id="layer-directive-sub-driver-badge" transform="translate(245, 735)">
    <rect x="0" y="0" width="370" height="42" rx="4" fill="#131722" stroke="#ff2a85" stroke-width="2.0" />
    <rect x="0" y="0" width="8" height="42" fill="url(#sunset-matte)" />
    <text x="24" y="27" class="font-mono" font-size="17" fill="#ffffff" letter-spacing="3.5">
      DIRECTIVE SUB DRIVER
    </text>
  </g>

</svg>