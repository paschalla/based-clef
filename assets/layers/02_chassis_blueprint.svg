<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">

  
  <defs>
    <!-- Deep Matte Carbon Canvas -->
    <linearGradient id="carbon-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#07080b" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <!-- Flat Triple Sunset Matte Gradient -->
    <linearGradient id="sunset-matte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="48%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;family=JetBrains+Mono:wght@700;800&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      .font-brand {
        font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-weight: 900;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Ubuntu Mono', 'SF Mono', monospace;
        font-weight: 800;
      }
    </style>
  </defs>

  <g id="layer-chassis-blueprint">
    <!-- Outer chamfered plate -->
    <polygon points="600,120 1100,360 1100,840 600,1080 100,840 100,360" 
             fill="none" stroke="#202636" stroke-width="3.2" />
    <!-- Inner bezel plate -->
    <polygon points="600,140 1076,372 1076,828 600,1060 124,828 124,372" 
             fill="none" stroke="#2a3348" stroke-width="2.0" />

    <!-- Vernier calibration ticks on chamfers -->
    <g stroke="#3a4660" stroke-width="1.8">
      <line x1="350" y1="240" x2="362" y2="246" />
      <line x1="250" y1="288" x2="262" y2="294" />
      <line x1="850" y1="240" x2="838" y2="246" />
      <line x1="950" y1="288" x2="938" y2="294" />
      <line x1="250" y1="912" x2="262" y2="906" />
      <line x1="350" y1="960" x2="362" y2="954" />
      <line x1="950" y1="912" x2="938" y2="906" />
      <line x1="850" y1="960" x2="838" y2="954" />
    </g>

    <!-- Top & bottom anodized frame rails ("====") -->
    <rect x="360" y="112" width="480" height="9" rx="2" fill="#141822" stroke="#2e364a" stroke-width="1.2" />
    <rect x="400" y="125" width="400" height="3" fill="url(#sunset-matte)" />

    <rect x="400" y="1063" width="400" height="3" fill="url(#sunset-matte)" />
    <rect x="360" y="1070" width="480" height="9" rx="2" fill="#141822" stroke="#2e364a" stroke-width="1.2" />

    <!-- Corner blueprint crosshairs -->
    <g stroke="#3a4660" stroke-width="1.5">
      <path d="M 40 40 L 80 40 M 40 40 L 40 80" fill="none" />
      <path d="M 1160 40 L 1120 40 M 1160 40 L 1160 80" fill="none" />
      <path d="M 40 1160 L 80 1160 M 40 1160 L 40 1120" fill="none" />
      <path d="M 1160 1160 L 1120 1160 M 1160 1160 L 1160 1120" fill="none" />
    </g>
  </g>

</svg>