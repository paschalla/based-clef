<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">

  
  <defs>
    <!-- Deep Matte Carbon Canvas -->
    <linearGradient id="carbon-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#07080b" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>

    <!-- Flat Triple Sunset Matte Gradient -->
    <linearGradient id="sunset-matte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="48%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;family=JetBrains+Mono:wght@700;800&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      .font-brand {
        font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-weight: 900;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Ubuntu Mono', 'SF Mono', monospace;
        font-weight: 800;
      }
    </style>
  </defs>

  <g id="layer-telemetry-rails">
    <!-- Top Telemetry Header -->
    <g class="font-mono" font-size="15" letter-spacing="2.5">
      <text x="80" y="80" fill="#94a3b8">SYS.01 // ARCHITECTURAL BLUEPRINT</text>
      <text x="1120" y="80" text-anchor="end" fill="#ff6b35">Φ = 1.618034</text>
      <line x1="80" y1="95" x2="1120" y2="95" stroke="#222838" stroke-width="1.5" />
    </g>

    <!-- Vertical Datum Alignment Line -->
    <line x1="656.03" y1="260" x2="656.03" y2="820" stroke="#364156" stroke-width="1.8" stroke-dasharray="4 6" />
    <text x="644.03" y="275" class="font-mono" font-size="14" fill="#64748b" text-anchor="end">DATUM Δx=0</text>

    <!-- Bottom Telemetry Spec Rail -->
    <g class="font-mono" font-size="17" text-anchor="middle" letter-spacing="4.0">
      <rect x="80" y="1115" width="1040" height="48" rx="4" fill="#080a0f" stroke="#1c2230" stroke-width="1.5" />
      <text x="600" y="1146" fill="#94a3b8">
        <tspan fill="#8b5cf6">// </tspan>200MS 
        <tspan fill="#ff2a85"> // </tspan>SYSTEM ONE PRECISION 
        <tspan fill="#ff6b35"> // </tspan>DIRECTIVE SUB DRIVER 
        <tspan fill="#8b5cf6"> // </tspan>LOW LEVEL 
        <tspan fill="#ff6b35">//</tspan>
      </text>
    </g>
  </g>

</svg>