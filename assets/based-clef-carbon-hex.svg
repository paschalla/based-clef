<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Carbon Background Gradient -->
    <radialGradient id="carbon-radial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#242830" />
      <stop offset="60%" stop-color="#15171c" />
      <stop offset="100%" stop-color="#0d0e12" />
    </radialGradient>

    <!-- Carbon Pattern Definition -->
    <pattern id="carbon-weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none" />
      <path d="M 0 0 L 6 6 M 6 0 L 12 6 M 0 6 L 6 12 M 6 6 L 12 12" stroke="#2a2e38" stroke-width="1.2" opacity="0.35" />
    </pattern>

    <!-- Purple -> Pink -> Orange Triple Gradient -->
    <linearGradient id="ppo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />    <!-- Electric Violet Purple -->
      <stop offset="48%" stop-color="#ff2a85" />   <!-- Hot Neon Pink -->
      <stop offset="100%" stop-color="#ff6b35" />  <!-- Sunset Electric Orange -->
    </linearGradient>

    <!-- Line Glow Filter -->
    <filter id="clean-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="512" height="512" fill="#090a0d" />

  <!-- Outer Hexagon Shadow & Geometry (Center: 256, 256, R: 216) -->
  <!-- Vertices of regular hexagon at (256, 256) radius 216: 
       top: (256, 40)
       top-right: (443, 148)
       bottom-right: (443, 364)
       bottom: (256, 472)
       bottom-left: (69, 364)
       top-left: (69, 148)
  -->
  <!-- Outer Hex Rim -->
  <polygon points="256,36 447,146 447,366 256,476 65,366 65,146" 
           fill="none" stroke="#2a2e39" stroke-width="2" opacity="0.8" />

  <!-- Main Carbon Hexagon Body -->
  <polygon points="256,46 438,151 438,361 256,466 74,361 74,151" 
           fill="url(#carbon-radial)" stroke="#383d4c" stroke-width="2.5" />
  
  <!-- Carbon Micro-texture Overlay -->
  <polygon points="256,46 438,151 438,361 256,466 74,361 74,151" 
           fill="url(#carbon-weave)" />

  <!-- Inner Accent Hex Frame (Clean subtle wireframe) -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" stroke="#252a36" stroke-width="1.5" />

  <!-- Subtle Precision Grid Lines -->
  <line x1="256" y1="46" x2="256" y2="100" stroke="#ff2a85" stroke-width="1.5" opacity="0.3" />
  <line x1="256" y1="412" x2="256" y2="466" stroke="#ff6b35" stroke-width="1.5" opacity="0.3" />
  <line x1="74" y1="151" x2="120" y2="178" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
  <line x1="438" y1="151" x2="392" y2="178" stroke="#ff2a85" stroke-width="1.5" opacity="0.3" />

  <!-- BASED CLEF GLYPH (Clean Minimal Line Design) -->
  <g filter="url(#clean-glow)">
    <!-- Node Head of the Clef: Concentric Precision Rings -->
    <circle cx="216" cy="180" r="22" fill="#15171c" stroke="url(#ppo-grad)" stroke-width="6" />
    <circle cx="216" cy="180" r="8" fill="url(#ppo-grad)" />

    <!-- Main Dynamic Curve of the Bass Clef -->
    <!-- Starts from top node (216, 180), loops over to the right and descends to the tail -->
    <path d="M 216 180 
             C 216 112, 332 112, 332 192 
             C 332 264, 256 316, 196 368" 
          fill="none" 
          stroke="url(#ppo-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Clean Vector Probability Gates (The 2 Clef Dots) -->
    <!-- Top Dot (Target Lock: Pink/Orange) -->
    <circle cx="376" cy="165" r="14" fill="#15171c" stroke="#ff2a85" stroke-width="4.5" />
    <circle cx="376" cy="165" r="5" fill="#ff6b35" />

    <!-- Bottom Dot (Action Fire: Orange) -->
    <circle cx="376" cy="225" r="14" fill="#15171c" stroke="#ff6b35" stroke-width="4.5" />
    <circle cx="376" cy="225" r="5" fill="#ffa035" />

    <!-- Fine Vector Ray connecting the probability dots (Clean Line Work) -->
    <line x1="376" y1="179" x2="376" y2="211" stroke="#ff2a85" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- Clean Minimalist Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif" 
        font-weight="800" font-size="20" letter-spacing="7" fill="#8e97ab">BASED CLEF</text>
  <circle cx="166" cy="414" r="2" fill="#8b5cf6" />
  <circle cx="346" cy="414" r="2" fill="#ff6b35" />
</svg>