[project]
name = "based-clef"
version = "0.2.0"
description = "Based Clef — Sub-second System 1 computer-use agent driven by Cloudflare Clef decision models with intent-to-playbook compilation, interactive Web Studio, and Human-in-the-Loop safety gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Andy Paschall"}
]
keywords = [
  "computer-use",
  "browser-automation",
  "cloudflare-workers-ai",
  "clef",
  "decision-model",
  "playwright",
  "mcp",
  "human-in-the-loop",
  "ai-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27", "rich>=13.0", "playwright>=1.44", "pillow>=10.0", "mss>=9.0"]

[project.optional-dependencies]
desktop = ["pytesseract", "numpy"]
mcp = ["mcp"]
all = ["pytesseract", "numpy", "mcp"]

[project.urls]
Homepage = "https://github.com/paschalla/based-clef"
Repository = "https://github.com/paschalla/based-clef"
Issues = "https://github.com/paschalla/based-clef/issues"
Documentation = "https://github.com/paschalla/based-clef#readme"

[project.scripts]
bclef = "decision_agent.cli:main"
based-clef = "decision_agent.cli:main"
da = "decision_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["based_clef*", "decision_agent*"]

[tool.setuptools.package-data]
decision_agent = ["demo/*.html"]
